name: Test setup-android without accepting licenses
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Java (required for sdkmanager)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
          java -version
      - id: action
        uses: .
        with:
          accept-android-sdk-licenses: 'false'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''
      - name: Assert ANDROID_HOME is set even without license acceptance
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ]; then
            echo "FAIL: ANDROID_HOME is not set"
            exit 1
          fi
          echo "PASS: ANDROID_HOME=$ANDROID_HOME"
      - name: Assert sdkmanager is available on PATH
        run: |
          if ! command -v sdkmanager &>/dev/null; then
            echo "FAIL: sdkmanager not found on PATH"
            exit 1
          fi
          echo "PASS: sdkmanager found at $(command -v sdkmanager)"
