name: Test skip license acceptance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-android
        uses: .
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''
        continue-on-error: true
      - name: Assert action ran and check outputs
        env:
          OUTCOME: ${{ steps.setup-android.outcome }}
          ANDROID_HOME_VAL: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT_VAL: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ANDROID_HOME: $ANDROID_HOME_VAL"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT_VAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ANDROID_HOME_VAL" ]; then
              echo "FAIL: action succeeded but ANDROID_HOME is not set"
              exit 1
            fi
            if [ -z "$ANDROID_SDK_ROOT_VAL" ]; then
              echo "FAIL: action succeeded but ANDROID_SDK_ROOT is not set"
              exit 1
            fi
            echo "PASS: ANDROID_HOME=$ANDROID_HOME_VAL, ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT_VAL"
            # Verify licenses were NOT accepted (no licenses directory or it's empty)
            LICENSES_DIR="$ANDROID_HOME_VAL/licenses"
            echo "Checking licenses dir: $LICENSES_DIR"
            if [ -d "$LICENSES_DIR" ] && [ "$(ls -A "$LICENSES_DIR" 2>/dev/null)" ]; then
              echo "INFO: licenses directory exists with content (may be pre-existing)"
              ls -la "$LICENSES_DIR" || true
            else
              echo "INFO: licenses directory does not exist or is empty as expected"
            fi
            echo "PASS: action completed without accepting licenses"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network/environment constraint in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
